<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · SlackBench</title>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --ink: #15171c; --ink-3: #5c6370; --accent: #1f5ad6; --soft: #eef1f5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0e1013; --ink: #eef1f5; --ink-3: #9aa3af; --accent: #8db4ff; --soft: #1b1f25; } }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    main { max-width: 440px; text-align: center; }
    svg { width: 44px; height: 44px; margin: 0 auto 18px; display: block; color: var(--ink); }
    .hole { fill: var(--bg); } .stroke { stroke: var(--bg); } .acc { fill: var(--accent); }
    h1 { font-size: 28px; letter-spacing: -0.02em; margin: 0 0 8px; }
    p { color: var(--ink-3); margin: 0 0 24px; line-height: 1.55; }
    a { display: inline-block; background: var(--ink); color: var(--bg); text-decoration: none; padding: 12px 18px; border-radius: 10px; font-weight: 500; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 32 32" aria-hidden="true">
      <path fill="currentColor" d="M8 3.5h16A5.5 5.5 0 0 1 29.5 9v10a5.5 5.5 0 0 1-5.5 5.5h-9l-5.3 4.2a.8.8 0 0 1-1.3-.7l.5-3.5H8A5.5 5.5 0 0 1 2.5 19V9A5.5 5.5 0 0 1 8 3.5z"/>
      <g class="stroke" fill="none" stroke-width="2" stroke-linecap="round"><path d="M11 9.5v9"/><path d="M11 16.2c0-3.1 2.2-4.7 6.6-4.7h1.4"/></g>
      <circle class="hole" cx="11" cy="9.5" r="2.1"/><circle class="hole" cx="11" cy="18.5" r="2.1"/><circle class="acc" cx="21.2" cy="11.5" r="2.5"/>
    </svg>
    <h1>Page not found</h1>
    <p>This page isn't part of the SlackBench site. It may have moved, or the link may be mistyped.</p>
    <a id="home" href="/">Back to SlackBench</a>
  </main>
  <script>
    /* On a GitHub Pages project site (user.github.io/<repo>/) home is /<repo>/; on a user/org site
       (<name>.github.io) or a custom domain it is /. Only switch when /<first-segment>/ really exists. */
    (function () {
      var home = document.getElementById("home");
      var seg = location.pathname.split("/").filter(Boolean)[0];
      if (!seg || !/\.github\.io$/.test(location.hostname) || !window.fetch) return;
      fetch("/" + seg + "/", { method: "HEAD" }).then(function (r) {
        if (r.ok) home.href = "/" + seg + "/";
      }).catch(function () {});
    })();
  </script>
</body>
</html>
